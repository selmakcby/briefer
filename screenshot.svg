<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" width="1200" height="720" font-family="'JetBrains Mono', 'Menlo', 'Consolas', monospace">
  <defs>
    <pattern id="scanlines2" width="100%" height="3" patternUnits="userSpaceOnUse">
      <rect width="100%" height="1.5" fill="rgba(0,0,0,0.2)"/>
    </pattern>
    <filter id="termGlow" x="-5%" y="-5%" width="110%" height="110%">
      <feGaussianBlur stdDeviation="0.4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Window frame -->
  <rect width="1200" height="720" rx="10" fill="#0a0a0a"/>

  <!-- Title bar -->
  <rect width="1200" height="38" rx="10" fill="#171717"/>
  <rect y="20" width="1200" height="18" fill="#171717"/>
  <circle cx="22" cy="19" r="6.5" fill="#ef4444"/>
  <circle cx="44" cy="19" r="6.5" fill="#fbbf24"/>
  <circle cx="66" cy="19" r="6.5" fill="#22c55e"/>
  <text x="600" y="24" font-size="13" fill="#737373" text-anchor="middle" letter-spacing="0.05em">~/sabah-asistani — briefer pipeline</text>

  <!-- Terminal content -->
  <g font-size="15" filter="url(#termGlow)">
    <!-- Prompt + command -->
    <text x="28" y="80">
      <tspan fill="#525252">[selma@cloud ~/sabah-asistani]</tspan>
      <tspan fill="#a3e635" dx="6">$</tspan>
      <tspan fill="#e5e5e5" dx="8">briefer pipeline</tspan>
      <tspan fill="#737373" dx="6">--interests vault/interests.md</tspan>
    </text>
    <text x="28" y="103" fill="#737373">
      <tspan>          </tspan>
      <tspan>--history vault/daily --max-age 24h</tspan>
    </text>

    <!-- stderr progress trace -->
    <text x="28" y="148" fill="#737373">fetched:</text>
    <text x="220" y="148" fill="#e5e5e5">70 items</text>

    <text x="28" y="173" fill="#737373">after max-age (24h):</text>
    <text x="220" y="173" fill="#e5e5e5">39 items</text>

    <text x="28" y="198" fill="#737373">after filter:</text>
    <text x="220" y="198" fill="#fbbf24">4 items</text>

    <text x="28" y="223" fill="#737373">after dedupe:</text>
    <text x="220" y="223" fill="#a3e635">3 items</text>

    <!-- separator -->
    <text x="28" y="258" fill="#404040" letter-spacing="0.1em">─── stdout (json) ───────────────────────────────────────────────────</text>

    <!-- JSON output -->
    <text x="28" y="290" fill="#525252">{</text>
    <text x="48" y="313" fill="#84cc16">"items"</text>
    <text x="120" y="313" fill="#525252">: [</text>

    <text x="68" y="338" fill="#525252">{</text>
    <text x="88" y="361" fill="#84cc16">"title"</text>
    <text x="155" y="361" fill="#525252">:</text>
    <text x="170" y="361" fill="#fbbf24">"Pentagon releases UFO files on new website"</text>
    <text x="690" y="361" fill="#525252">,</text>

    <text x="88" y="384" fill="#84cc16">"url"</text>
    <text x="135" y="384" fill="#525252">:</text>
    <text x="150" y="384" fill="#fbbf24">"https://techcrunch.com/2026/05/08/pentagon-..."</text>
    <text x="710" y="384" fill="#525252">,</text>

    <text x="88" y="407" fill="#84cc16">"source"</text>
    <text x="160" y="407" fill="#525252">:</text>
    <text x="175" y="407" fill="#fbbf24">"techcrunch"</text>
    <text x="285" y="407" fill="#525252">,</text>

    <text x="88" y="430" fill="#84cc16">"published_at"</text>
    <text x="220" y="430" fill="#525252">:</text>
    <text x="235" y="430" fill="#fbbf24">"2026-05-08T15:56:36Z"</text>

    <text x="68" y="453" fill="#525252">},</text>

    <text x="68" y="476" fill="#525252">{ ... 2 more items ... }</text>

    <text x="48" y="499" fill="#525252">]</text>
    <text x="28" y="522" fill="#525252">}</text>

    <!-- success line -->
    <text x="28" y="567">
      <tspan fill="#84cc16">✓</tspan>
      <tspan fill="#e5e5e5" dx="10">ready in 247ms</tspan>
      <tspan fill="#525252" dx="14">·</tspan>
      <tspan fill="#fbbf24" dx="14">0 LLM tokens</tspan>
      <tspan fill="#525252" dx="14">·</tspan>
      <tspan fill="#737373" dx="14">9.2 MB binary</tspan>
    </text>

    <!-- next prompt -->
    <text x="28" y="612">
      <tspan fill="#525252">[selma@cloud ~/sabah-asistani]</tspan>
      <tspan fill="#a3e635" dx="6">$</tspan>
      <tspan fill="#a3e635" dx="8">█</tspan>
    </text>
  </g>

  <!-- Bottom hint -->
  <text x="600" y="685" font-size="12" fill="#404040" text-anchor="middle" letter-spacing="0.15em">
    HN · arXiv · TechCrunch · Anthropic ── parallel fetch · keyword filter · 7-day dedupe ── 0 tokens
  </text>

  <rect width="1200" height="720" rx="10" fill="url(#scanlines2)" opacity="0.5"/>
</svg>
