<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 600" width="1600" height="600" font-family="'JetBrains Mono', 'Menlo', 'Consolas', monospace">
  <defs>
    <!-- Scanline pattern -->
    <pattern id="scanlines" width="100%" height="3" patternUnits="userSpaceOnUse">
      <rect width="100%" height="1.5" fill="rgba(0,0,0,0.25)"/>
    </pattern>

    <!-- CRT glow -->
    <filter id="crtGlow" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur stdDeviation="1.2" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Vignette -->
    <radialGradient id="vignette" cx="0.5" cy="0.5" r="0.75">
      <stop offset="50%" stop-color="rgba(0,0,0,0)"/>
      <stop offset="100%" stop-color="rgba(0,0,0,0.85)"/>
    </radialGradient>

    <!-- Phosphor green -->
    <linearGradient id="phosphor" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#a3e635"/>
      <stop offset="100%" stop-color="#65a30d"/>
    </linearGradient>
  </defs>

  <!-- Pure black background -->
  <rect width="1600" height="600" fill="#000000"/>

  <!-- Faint matrix rain (decoration) -->
  <g opacity="0.08" font-size="12" fill="#22c55e">
    <text x="40"   y="60">01</text>
    <text x="40"   y="120">10</text>
    <text x="40"   y="180">11</text>
    <text x="40"   y="240">01</text>
    <text x="40"   y="300">00</text>
    <text x="40"   y="360">10</text>
    <text x="40"   y="420">11</text>
    <text x="40"   y="480">01</text>
    <text x="40"   y="540">10</text>

    <text x="1530" y="60">11</text>
    <text x="1530" y="120">01</text>
    <text x="1530" y="180">00</text>
    <text x="1530" y="240">10</text>
    <text x="1530" y="300">11</text>
    <text x="1530" y="360">01</text>
    <text x="1530" y="420">10</text>
    <text x="1530" y="480">00</text>
    <text x="1530" y="540">11</text>

    <text x="80"  y="540">$</text>
    <text x="120" y="540">_</text>
    <text x="1480" y="60">$</text>
    <text x="1500" y="60">_</text>
  </g>

  <!-- Top status bar -->
  <text x="80" y="50" font-size="13" fill="#525252" letter-spacing="0.2em">
    ┌─ briefer ──────────────────────────────────────────────────────────────────────────────────────────── selmakcby/briefer · v0.1.0 ─┐
  </text>

  <!-- Main wordmark — block letters, ASCII style -->
  <g fill="#a3e635" filter="url(#crtGlow)" font-weight="700">
    <text x="80" y="170" font-size="100" letter-spacing="-0.04em">▓▓ briefer</text>
    <text x="80" y="220" font-size="22" fill="#84cc16" letter-spacing="0.2em">&gt; TOKEN-EFFICIENT NEWS PIPELINE</text>
  </g>

  <!-- Tagline -->
  <text x="80" y="280" font-size="22" fill="#737373">
    fetch · filter · dedupe ─ in zero LLM tokens.
  </text>

  <!-- Terminal output block (the actual flex) -->
  <g font-size="20">
    <!-- Prompt line 1 -->
    <text x="80" y="350">
      <tspan fill="#525252">[selma@cloud ~/sabah-asistani]</tspan>
      <tspan fill="#a3e635" dx="8">$</tspan>
      <tspan fill="#e5e5e5" dx="8">briefer pipeline</tspan>
      <tspan fill="#737373" dx="6">--interests vault/interests.md</tspan>
    </text>

    <!-- Output -->
    <text x="80" y="395" fill="#737373">fetched:</text>
    <text x="280" y="395" fill="#e5e5e5">100 items</text>

    <text x="80" y="425" fill="#737373">after filter:</text>
    <text x="280" y="425" fill="#e5e5e5">32 items</text>

    <text x="80" y="455" fill="#737373">after dedupe:</text>
    <text x="280" y="455" fill="#a3e635">12 items</text>

    <text x="80" y="500">
      <tspan fill="#84cc16">✓</tspan>
      <tspan fill="#e5e5e5" dx="10">ready in 247ms</tspan>
      <tspan fill="#525252" dx="14">·</tspan>
      <tspan fill="#fbbf24" dx="14">0 LLM tokens</tspan>
    </text>

    <text x="80" y="540">
      <tspan fill="#a3e635">$</tspan>
      <tspan fill="#a3e635" dx="6">█</tspan>
    </text>
  </g>

  <!-- Right column ASCII pipeline diagram -->
  <g font-size="14" fill="#525252" letter-spacing="0.05em">
    <text x="900" y="350">┌──────────────┐</text>
    <text x="900" y="370">│ hn           │  ┐</text>
    <text x="900" y="390">├──────────────┤  │</text>
    <text x="900" y="410">│ arxiv        │  │  ┌──────────┐    ┌──────────┐</text>
    <text x="900" y="430">├──────────────┤  ┼─→│  filter  │ ─→ │  dedupe  │ ─→ filtered.json</text>
    <text x="900" y="450">│ techcrunch   │  │  └──────────┘    └──────────┘</text>
    <text x="900" y="470">├──────────────┤  │</text>
    <text x="900" y="490">│ anthropic    │  ┘</text>
    <text x="900" y="510">└──────────────┘</text>

    <text x="900" y="545" fill="#84cc16">[ 4 sources · parallel · go binary · 9MB ]</text>
  </g>

  <!-- Bottom status -->
  <text x="80" y="582" font-size="13" fill="#404040" letter-spacing="0.15em">
    └────────────────────────────────────────────────────────────────────────────── @selma.builds ─ MIT ─────┘
  </text>

  <!-- Scanlines overlay -->
  <rect width="1600" height="600" fill="url(#scanlines)" opacity="0.6"/>

  <!-- Vignette overlay -->
  <rect width="1600" height="600" fill="url(#vignette)"/>
</svg>
