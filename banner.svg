<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 500" width="1600" height="500" font-family="'JetBrains Mono', 'SF Mono', 'Menlo', 'Consolas', monospace">
  <!-- Background -->
  <rect width="1600" height="500" fill="#0a0a0a"/>

  <!-- Top hairline -->
  <line x1="0" y1="0.5" x2="1600" y2="0.5" stroke="#1f1f1f" stroke-width="1"/>

  <!-- LEFT COLUMN -->
  <g>
    <!-- Wordmark -->
    <text x="80" y="220" font-size="120" font-weight="700" letter-spacing="-0.05em">
      <tspan fill="#fafafa">briefer</tspan><tspan fill="#a3e635">_</tspan>
    </text>

    <!-- Tagline -->
    <text x="84" y="268" font-size="22" fill="#737373">token-efficient morning briefing pipeline.</text>

    <!-- Accent rule -->
    <rect x="84" y="312" width="56" height="3" fill="#a3e635"/>

    <!-- Stat line -->
    <text x="84" y="372" font-size="22">
      <tspan fill="#a3e635" font-weight="600">~70%</tspan>
      <tspan fill="#737373" dx="10">fewer tokens</tspan>
      <tspan fill="#3f3f3f" dx="16">·</tspan>
      <tspan fill="#a3e635" font-weight="600" dx="16">~30 ms</tspan>
      <tspan fill="#737373" dx="10">cold start</tspan>
      <tspan fill="#3f3f3f" dx="16">·</tspan>
      <tspan fill="#a3e635" font-weight="600" dx="16">0</tspan>
      <tspan fill="#737373" dx="10">LLM calls</tspan>
    </text>

    <!-- Footer meta -->
    <text x="84" y="448" font-size="13" fill="#525252" letter-spacing="0.18em">GO · MIT · @SELMA.BUILDS</text>
  </g>

  <!-- RIGHT COLUMN — pipeline diagram -->
  <g font-family="'JetBrains Mono', 'SF Mono', 'Menlo', 'Consolas', monospace">
    <!-- Section label -->
    <text x="820" y="108" font-size="11" fill="#525252" letter-spacing="0.28em">SOURCES</text>

    <!-- Source pills -->
    <g>
      <rect x="820" y="120" width="140" height="38" rx="4" fill="#101010" stroke="#262626"/>
      <text x="836" y="144" font-size="14" fill="#d4d4d4">hn</text>
      <text x="944" y="144" font-size="11" fill="#404040" text-anchor="end">JSON</text>

      <rect x="820" y="166" width="140" height="38" rx="4" fill="#101010" stroke="#262626"/>
      <text x="836" y="190" font-size="14" fill="#d4d4d4">arxiv</text>
      <text x="944" y="190" font-size="11" fill="#404040" text-anchor="end">ATOM</text>

      <rect x="820" y="212" width="140" height="38" rx="4" fill="#101010" stroke="#262626"/>
      <text x="836" y="236" font-size="14" fill="#d4d4d4">techcrunch</text>
      <text x="944" y="236" font-size="11" fill="#404040" text-anchor="end">RSS</text>

      <rect x="820" y="258" width="140" height="38" rx="4" fill="#101010" stroke="#262626"/>
      <text x="836" y="282" font-size="14" fill="#d4d4d4">anthropic</text>
      <text x="944" y="282" font-size="11" fill="#404040" text-anchor="end">XML</text>
    </g>

    <!-- Merge tree -->
    <g stroke="#3f3f3f" stroke-width="1" fill="none">
      <line x1="960" y1="139" x2="1010" y2="139"/>
      <line x1="960" y1="185" x2="1010" y2="185"/>
      <line x1="960" y1="231" x2="1010" y2="231"/>
      <line x1="960" y1="277" x2="1010" y2="277"/>
      <line x1="1010" y1="139" x2="1010" y2="277"/>
      <line x1="1010" y1="208" x2="1058" y2="208"/>
    </g>
    <polygon points="1058,204 1066,208 1058,212" fill="#3f3f3f"/>

    <!-- Filter box -->
    <rect x="1066" y="180" width="130" height="56" rx="4" fill="#101010" stroke="#404040"/>
    <text x="1131" y="208" font-size="15" fill="#fafafa" text-anchor="middle">filter</text>
    <text x="1131" y="223" font-size="10" fill="#525252" text-anchor="middle" letter-spacing="0.1em">INTERESTS.MD</text>

    <!-- Arrow filter → dedupe -->
    <line x1="1196" y1="208" x2="1240" y2="208" stroke="#3f3f3f" stroke-width="1"/>
    <polygon points="1240,204 1248,208 1240,212" fill="#3f3f3f"/>

    <!-- Dedupe box -->
    <rect x="1248" y="180" width="130" height="56" rx="4" fill="#101010" stroke="#404040"/>
    <text x="1313" y="208" font-size="15" fill="#fafafa" text-anchor="middle">dedupe</text>
    <text x="1313" y="223" font-size="10" fill="#525252" text-anchor="middle" letter-spacing="0.1em">LAST 7 DAYS</text>

    <!-- Arrow dedupe → output (accent) -->
    <line x1="1378" y1="208" x2="1422" y2="208" stroke="#a3e635" stroke-width="1.2"/>
    <polygon points="1422,204 1430,208 1422,212" fill="#a3e635"/>

    <!-- Output -->
    <text x="1438" y="205" font-size="13" fill="#a3e635">items.json</text>
    <text x="1438" y="222" font-size="11" fill="#525252">→ summarizer</text>

    <!-- Footer note under pipeline -->
    <text x="1486" y="312" font-size="11" fill="#404040" text-anchor="end" letter-spacing="0.18em">DETERMINISTIC · GO · 0 TOKENS</text>
    <line x1="820" y1="324" x2="1486" y2="324" stroke="#1f1f1f" stroke-width="1"/>
  </g>
</svg>
