<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 600" width="1600" height="600">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0a0e1a"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="title" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#7dd3fc"/>
      <stop offset="50%" stop-color="#22d3ee"/>
      <stop offset="100%" stop-color="#a78bfa"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1e293b" stroke-width="1" opacity="0.5"/>
    </pattern>
    <radialGradient id="vignette" cx="0.5" cy="0.5" r="0.7">
      <stop offset="60%" stop-color="rgba(0,0,0,0)"/>
      <stop offset="100%" stop-color="rgba(0,0,0,0.6)"/>
    </radialGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1600" height="600" fill="url(#bg)"/>
  <rect width="1600" height="600" fill="url(#grid)"/>
  <rect width="1600" height="600" fill="url(#vignette)"/>

  <!-- Floating accent blobs -->
  <circle cx="1450" cy="80" r="180" fill="#22d3ee" opacity="0.06"/>
  <circle cx="120" cy="540" r="220" fill="#a78bfa" opacity="0.05"/>

  <!-- Top bar with branding -->
  <text x="60" y="60" font-family="'JetBrains Mono', monospace" font-size="14" fill="#475569" letter-spacing="0.2em">
    SELMAKCBY / BRIEFER · v0.1.0
  </text>

  <!-- Main title -->
  <text x="60" y="240" font-family="'Inter', -apple-system, sans-serif" font-size="200" font-weight="900" fill="url(#title)" letter-spacing="-0.04em" filter="url(#glow)">
    briefer
  </text>

  <!-- Subtitle -->
  <text x="64" y="305" font-family="'Inter', -apple-system, sans-serif" font-size="32" font-weight="600" fill="#cbd5e1" letter-spacing="-0.01em">
    token-efficient news pipeline
  </text>
  <text x="64" y="345" font-family="'Inter', -apple-system, sans-serif" font-size="22" font-weight="400" fill="#64748b">
    fetch · filter · dedupe — in zero LLM tokens.
  </text>

  <!-- Terminal mockup (right side) -->
  <g transform="translate(900, 130)">
    <!-- Terminal window -->
    <rect width="640" height="380" rx="12" fill="#010409" stroke="#21262d" stroke-width="1"/>

    <!-- Window controls -->
    <circle cx="22" cy="22" r="6" fill="#fb7185"/>
    <circle cx="44" cy="22" r="6" fill="#fbbf24"/>
    <circle cx="66" cy="22" r="6" fill="#34d399"/>
    <text x="320" y="27" font-family="'JetBrains Mono', monospace" font-size="12" fill="#475569" text-anchor="middle">
      ~ briefer
    </text>

    <!-- Terminal content -->
    <g font-family="'JetBrains Mono', monospace" font-size="16">
      <text x="24" y="80">
        <tspan fill="#56d364">$</tspan>
        <tspan fill="#c9d1d9" dx="8">briefer pipeline \</tspan>
      </text>
      <text x="44" y="106" fill="#c9d1d9">
        --interests vault/interests.md \
      </text>
      <text x="44" y="132" fill="#c9d1d9">
        --history vault/daily
      </text>

      <text x="24" y="178" fill="#7dd3fc">fetched:</text>
      <text x="160" y="178" fill="#f1f5f9" font-weight="600">100 items</text>

      <text x="24" y="210" fill="#7dd3fc">after filter:</text>
      <text x="200" y="210" fill="#f1f5f9" font-weight="600">32 items</text>

      <text x="24" y="242" fill="#7dd3fc">after dedupe:</text>
      <text x="216" y="242" fill="#f1f5f9" font-weight="600">12 items</text>

      <text x="24" y="290" fill="#fbbf24">✓ ready in 247ms</text>

      <text x="24" y="322" fill="#fb7185" font-weight="600">0 LLM tokens used</text>

      <!-- Cursor -->
      <text x="24" y="358">
        <tspan fill="#56d364">$</tspan>
        <tspan fill="#56d364" dx="6">▎</tspan>
      </text>
    </g>
  </g>

  <!-- Pipeline diagram (bottom left) -->
  <g transform="translate(60, 430)">
    <text font-family="'JetBrains Mono', monospace" font-size="13" fill="#64748b" letter-spacing="0.15em">
      PIPELINE
    </text>
    <g transform="translate(0, 30)" font-family="'JetBrains Mono', monospace" font-size="20" font-weight="600">
      <!-- HN -->
      <rect width="120" height="48" rx="8" fill="rgba(125,211,252,0.06)" stroke="#7dd3fc" stroke-width="1.5"/>
      <text x="60" y="32" text-anchor="middle" fill="#7dd3fc">hn</text>

      <!-- arXiv -->
      <rect x="140" width="120" height="48" rx="8" fill="rgba(125,211,252,0.06)" stroke="#7dd3fc" stroke-width="1.5"/>
      <text x="200" y="32" text-anchor="middle" fill="#7dd3fc">arxiv</text>

      <!-- TC -->
      <rect x="280" width="160" height="48" rx="8" fill="rgba(125,211,252,0.06)" stroke="#7dd3fc" stroke-width="1.5"/>
      <text x="360" y="32" text-anchor="middle" fill="#7dd3fc">techcrunch</text>

      <!-- Anthropic -->
      <rect x="460" width="160" height="48" rx="8" fill="rgba(125,211,252,0.06)" stroke="#7dd3fc" stroke-width="1.5"/>
      <text x="540" y="32" text-anchor="middle" fill="#7dd3fc">anthropic</text>

      <!-- Arrow + result -->
      <text x="640" y="32" fill="#475569" font-size="22">→</text>

      <rect x="670" width="140" height="48" rx="8" fill="rgba(251,191,36,0.08)" stroke="#fbbf24" stroke-width="1.5"/>
      <text x="740" y="32" text-anchor="middle" fill="#fbbf24">filtered</text>
    </g>
  </g>

  <!-- Bottom corner stats -->
  <g transform="translate(60, 540)" font-family="'Inter', sans-serif" font-size="14" fill="#64748b">
    <text>30ms compile · 9MB binary · 4 sources · 0 LLM tokens</text>
  </g>
  <text x="1540" y="570" font-family="'JetBrains Mono', monospace" font-size="13" fill="#475569" text-anchor="end" letter-spacing="0.15em">
    @SELMA.BUILDS
  </text>
</svg>
